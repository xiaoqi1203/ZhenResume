# 全栈本机 Docker：PostgreSQL(pgvector) + Redis + API + Celery worker + 前端
#
# ⚠️ 本文件已从「隧道连 VM 中间件」改写为**自包含全栈**（2026-10-16）。
#    不再需要 SSH 隧道、不依赖 VM。若仍想用 VM 中间件，见
#    docs/ZhenResume_本机Docker部署与VM中间件.md（保留为备选方案）。
#
# 与另外两份 compose 的关系（互不干扰）：
#   · docker-compose.yml（仓库根）        前后端容器 + SQLite，profiles=legacy 默认停用
#   · deploy/infra/docker-compose.yml     中间件 + 应用同机（原 VM 形态）
#   · 本文件                               全部在本机 Docker（现在这份）
#
# 用法：
#   Copy-Item .env.local.example .env.local     # 填 PG/Redis 密码
#   docker compose -f docker-compose.local.yml --env-file .env.local up -d --build
#   docker compose -f docker-compose.local.yml logs -f api worker
#   docker compose -f docker-compose.local.yml down            # 保留数据卷
#   docker compose -f docker-compose.local.yml down -v         # ⚠️ 连数据一起删
#
# 首次启动会自动建表 + 知识库为空则灌种子（app/main.py::lifespan），无需迁移步骤。

name: zhenresume-local

x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile
  args:
    # 国内直连 files.pythonhosted.org 实测只有 37–74 kB/s，psycopg-binary 会读超时
    PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    # 离线兜底：先在宿主机 `pip download -d backend/wheels`，再传 PIP_FIND_LINKS=wheels
    PIP_FIND_LINKS: ${PIP_FIND_LINKS:-}
    # 本地 OCR 引擎（图片简历 / 扫描版 PDF；零外部 API）。
    #   rapidocr（默认）= 纯 pip + 3 个系统库，约 70MB，中文效果好
    #   tesseract      = 更轻（apt 约 15MB），中文精度略逊
    #   none           = 不装；这两类输入会返回 ocr-unavailable 并由前端提示换格式
    # ⚠️ OCR 必须在**镜像内**装：后端跑在容器里，宿主机的 Python 包/二进制它看不见。
    INSTALL_OCR: ${INSTALL_OCR:-rapidocr}

x-backend-env: &backend-env
  PYTHONUTF8: "1"
  # 上传文件与报告落共享卷；api / worker 必须看到同一份
  UPLOAD_DIR: /app/data/uploads
  # 容器之间用服务名互联（不是 127.0.0.1）
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-zhenresume}:${POSTGRES_PASSWORD:?请先复制 .env.local.example 为 .env.local 并设置密码}@db:5432/${POSTGRES_DB:-zhenresume}
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?请在 .env.local 设置 REDIS_PASSWORD}@redis:6379/1
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
  # 工作流：celery 执行 + LangGraph 编排 + 三路并行（与本项目测过的推荐组合一致）
  WORKFLOW_EXECUTOR: ${WORKFLOW_EXECUTOR:-celery}
  WORKFLOW_ENGINE: ${WORKFLOW_ENGINE:-langgraph}
  WORKFLOW_PARALLEL: ${WORKFLOW_PARALLEL:-true}
  HR_SCREENING: ${HR_SCREENING:-true}
  HR_BATCH_CONCURRENCY: ${HR_BATCH_CONCURRENCY:-50}
  # 断点续跑存 PG（容器里用 sqlite 文件会随容器重建丢失；PG 才持久）
  LANGGRAPH_CHECKPOINT: ${LANGGRAPH_CHECKPOINT:-postgres}
  # 浏览器访问的是**宿主机**，所以这三项必须与宿主端口对齐，否则前端 CORS 报错
  CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
  # embedding 回退层若用宿主机 Ollama（容器内 -> 宿主机）
  EMBEDDING_FALLBACK_BASE_URL: ${EMBEDDING_FALLBACK_BASE_URL:-http://host.docker.internal:11434/v1}

services:
  # ---------------------------------------------------------------- 中间件
  db:
    # 本机已有该镜像（627MB），避免从国内加速器拉取大层时超时。
    # 若你想用 pg16：改成 pgvector/pgvector:pg16 并 `docker compose pull db`；
    # ⚠️ 换大版本后旧数据卷不兼容（PG 数据目录格式随主版本变化），需 `down -v` 重建。
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg17}
    container_name: zhenresume-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zhenresume}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-zhenresume}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      # 只绑回环：宿主机上的 psql/工具能用，局域网不可见。不需要就删掉这段。
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - zhenresume-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zhenresume} -d ${POSTGRES_DB:-zhenresume}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # 并发写（HR 批量 + 三路并行）是上 PG 的唯一目的，给足连接数
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=512MB
      -c work_mem=8MB
      -c maintenance_work_mem=128MB
      -c effective_cache_size=2GB

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: zhenresume-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - zhenresume-redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # ---------------------------------------------------------------- 应用
  api:
    build: *backend-build
    image: zhenresume-backend:local
    container_name: zhenresume-api
    restart: unless-stopped
    init: true
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    # 直接复用 backend/.env（LLM Key / 模型 / embedding 配置都在里面）；
    # environment 优先级高于 env_file，所以上面的容器专用值会覆盖它。
    env_file:
      - ./backend/.env
    environment: *backend-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - zhenresume-appdata:/app/data
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build: *backend-build
    image: zhenresume-backend:local
    container_name: zhenresume-worker
    restart: unless-stopped
    init: true
    # 镜像继承的 HEALTHCHECK 是探 API 的 /api/v1/health，worker 不提供 HTTP 服务，
    # 不关掉会永远显示 unhealthy，误导排查。
    healthcheck:
      disable: true
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file:
      - ./backend/.env
    environment: *backend-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - zhenresume-appdata:/app/data
    # 一个 Celery 任务 = 一份诊断或整个 HR 批次；批内自己用 asyncio 并发
    command: ["celery", "-A", "app.worker", "worker", "-l", "INFO", "-Q", "default", "--concurrency=4"]

  # ---------------------------------------------------------------- 前端
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # ⚠️ Next 的 NEXT_PUBLIC_* 是**构建期内联**：必须是浏览器能访问到的地址。
        #    填容器名（如 api:8000）会导致浏览器请求失败，且改完必须重新 build。
        NEXT_PUBLIC_API_BASE: ${PUBLIC_API_BASE:-http://localhost:8000}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    image: zhenresume-frontend:local
    container_name: zhenresume-frontend
    restart: unless-stopped
    init: true
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  zhenresume-pgdata:
    name: zhenresume-pgdata
  zhenresume-redisdata:
    name: zhenresume-redisdata
  zhenresume-appdata:
    name: zhenresume-appdata
