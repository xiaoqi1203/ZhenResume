name: zhenresume
# ⚠️ 本文件已**默认停用**（两个服务的 profiles 都是 legacy）。
#
# 原因：这是"前后端都进容器"的旧方案；现在的实际形态是
#   · 中间件（PostgreSQL + Redis）在 Docker —— 见 deploy/infra/docker-compose.yml
#   · API / Celery worker 跑在宿主机
# 保留它默认不启动，是为了避免 PyCharm 的 Compose 部署自动把它拉起来抢占 8000 端口。
# 确实要用容器跑前后端时：docker compose --profile legacy up -d --build
services:
  backend:
    profiles: ["legacy"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: "${PIP_INDEX_URL:-}"
    image: zhenresume-backend:1.0.0
    container_name: zhenresume-backend
    restart: unless-stopped
    init: true
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: sqlite+pysqlite:////app/data/zhenresume.db
      UPLOAD_DIR: /app/data/uploads
      CORS_ORIGINS: "${CORS_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}"
      FRONTEND_BASE_URL: "${FRONTEND_BASE_URL:-http://localhost:3000}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-deepseek-chat}"
      LIBREOFFICE_NODE: "${LIBREOFFICE_NODE:-}"
      LIBREOFFICE_CLI: "${LIBREOFFICE_CLI:-}"
    volumes:
      - zhenresume-data:/app/data
      # ⚠️ 这里原来挂的是仓库根目录（/home/xiaoqi/ZhenResume:/app），会把镜像里
      # 构建好的代码目录 /app/app 整个覆盖掉 → uvicorn 报 `No module named 'app'` 并无限重启。
      # 镜像的构建上下文是 ./backend，所以挂载也必须指向 backend 目录。
      - /home/xiaoqi/ZhenResume/backend:/app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    profiles: ["legacy"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: "${NEXT_PUBLIC_API_BASE:-http://192.168.10.128:8000}"
        NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmjs.org}"
    image: zhenresume-frontend:1.0.0
    container_name: zhenresume-frontend
    restart: unless-stopped
    init: true
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  zhenresume-data:
    name: zhenresume-data
